<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página Inicial | ChatBot</title>
    <link
      rel=" icon "
      type="image/png"
      href="assets/icons/logo-saga-blue.svg"
    />
    <link rel="stylesheet" href="../assets/css/global.css" />
    <link rel="stylesheet" href="../assets/css/chatbot.css" />
  </head>

  <body>
    <!--header para a organização da tela inicial globa-->
    <header class="header-global-configuration">
      <div class="logo-inicial">
        <img
          src="../assets/icons/logo-saga-blue.svg"
          alt="logo-inicial"
          id="logo-principal"
        />
      </div>
      <!--logo do site-->

      <div class="icone-perfil">
        <a href="../pages/configuracoes.html"
          ><img
            src="../assets/icons/usuario-icon.svg"
            alt="icone-usuario"
            id="icone-usuario"
        /></a>
      </div>
      <!--Icone de usuário-->
    </header>

    <nav>
      <!-- Side Bar principal de todo site -->

      <article id="nav-container-section">
        <section>
          <a href="../pages/relatorio.html">
            <img
              src="../assets/icons/global-relatorio-icon.svg"
              alt="icone de relatório"
              id="rel"
            />
            <h2>Relatório</h2>
          </a>
        </section>

        <section>
          <a href="../pages/dashboard.html">
            <img
              src="../assets/icons/global-dashboard-icon.svg"
              alt="icone de dashboard"
              id="dash"
            />
            <h2>Dashboard</h2>
          </a>
        </section>

        <section>
          <a href="../pages/historico.html">
            <img
              src="../assets/icons/global-historico-icon.svg"
              alt="icone de histórico"
              id="histo"
            />
            <h2>Histórico</h2>
          </a>
        </section>

        <section class="active">
          <a href="../pages/chatbot.html">
            <img
              src="../assets/icons/global-chatbot-icon.svg"
              alt="icone de ChatBot"
              id="chat"
            />
            <h2>ChatBot</h2>
          </a>
        </section>

        <section id="hidden-config">
          <a href="../pages/configuracoes.html">
            <img
              src="../assets/icons/global-configuracoes-icon.svg"
              alt="icone de configurações"
              id="config"
            />
            <h2>Configurações</h2>
          </a>
        </section>
      </article>
    </nav>

    <main>
      <header class="header-main-global">
        <section class="header-section-global">
          <svg fill="#000000" viewBox="0 0 32 32" id="icon" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"><defs><style>.cls-1{fill:none;}</style></defs><title>chat-bot</title><path d="M16,19a6.9908,6.9908,0,0,1-5.833-3.1287l1.666-1.1074a5.0007,5.0007,0,0,0,8.334,0l1.666,1.1074A6.9908,6.9908,0,0,1,16,19Z"></path><path d="M20,8a2,2,0,1,0,2,2A1.9806,1.9806,0,0,0,20,8Z"></path><path d="M12,8a2,2,0,1,0,2,2A1.9806,1.9806,0,0,0,12,8Z"></path><path d="M17.7358,30,16,29l4-7h6a1.9966,1.9966,0,0,0,2-2V6a1.9966,1.9966,0,0,0-2-2H6A1.9966,1.9966,0,0,0,4,6V20a1.9966,1.9966,0,0,0,2,2h9v2H6a3.9993,3.9993,0,0,1-4-4V6A3.9988,3.9988,0,0,1,6,2H26a3.9988,3.9988,0,0,1,4,4V20a3.9993,3.9993,0,0,1-4,4H21.1646Z"></path><rect id="_Transparent_Rectangle_" data-name="&lt;Transparent Rectangle&gt;" class="cls-1" width="32" height="32"></rect></g></svg>
          <h2>ChatBot</h2>
          <p>Este Chat não salva o histórico</p>
        </section>
      </header>

      <!-- Início do código -->

      <section class="chatbot-container">

        <!-- Área onde as mensagens aparecerão -->

        <section class="chat-mensagens" id="chatMensagens">
            <!-- Exemplo de mensagem do chatbot -->
            <div class="mensagem chatbot">Olá! Como posso ajudar você hoje?</div>
        </section>

        <!-- Área de envio -->
        <section class="chat-input-container">
          <textarea id="chatInput" class="chatInput" placeholder="Peça ao Chatbot"></textarea>

          <button id="btnEnviar">
            <img src="../assets/icons/chatbot-send-icon.svg" alt="Enviar mensagem"/>
          </button>

        </section>

      </section>

    </main>

    <script src="../assets/javascript/chatbot.js"></script>
    <script src="../assets/javascript/global.js"></script>
  </body>
</html>
